name: Build debug APK (use runner SDK)

on:
  push:
    branches:
      - hotspot-vpn-compat
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Azul_jdk/17.0.*/x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clone native hev-socks5-tunnel into app/src/main/jni
      run: |
        rm -rf app/src/main/jni || true
        mkdir -p app/src/main
        git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni
      shell: bash

    - name: Use runner Android SDK (/usr/local/lib/android/sdk)
      run: |
        # Point Android variables to the runner-installed SDK
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        # Add common SDK tool locations if they exist
        if [ -d "/usr/local/lib/android/sdk/platform-tools" ]; then
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
        fi
        if [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        elif [ -d "/usr/local/lib/android/sdk/tools/bin" ]; then
          echo "/usr/local/lib/android/sdk/tools/bin" >> $GITHUB_PATH
        fi
        # Print a short check
        echo "ANDROID_HOME and ANDROID_SDK_ROOT set to /usr/local/lib/android/sdk"
        ls -la /usr/local/lib/android/sdk || true
      shell: bash

    - name: Grant execute to gradlew
      run: chmod +x ./gradlew

    - name: Show env (debug)
      run: env | grep -E 'ANDROID|JAVA' || true

    - name: Build debug APK
      run: ./gradlew :app:clean :app:assembleDebug --no-daemon --info
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: List produced native libs and APK
      run: |
        echo "jniLibs in APK packaging folder (app/src/main/jniLibs):"
        ls -R app/src/main/jniLibs || true
        echo "Built libs under app/build:"
        find app/build -name "libhev-socks5-tunnel.so" -print || true
        echo "APK files:"
        ls -R app/build/outputs/apk || true
      shell: bash

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
