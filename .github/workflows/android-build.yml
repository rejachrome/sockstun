name: Build debug APK

on:
  push:
    branches:
      - hotspot-vpn-compat
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Azul_jdk/17.0.*/x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK components
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y wget unzip
        ANDROID_HOME="$HOME/android-sdk"
        mkdir -p "${ANDROID_HOME}/cmdline-tools"
        cd "$HOME"
        # download commandlinetools (update URL later if required)
        wget -O cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        unzip -q cmdline.zip -d cmdline-tools-temp
        mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
        mv cmdline-tools-temp/cmdline-tools/* "${ANDROID_HOME}/cmdline-tools/latest/" || true
        export ANDROID_HOME="${ANDROID_HOME}"
        export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
        # Use sdkmanager with explicit --sdk_root pointing at ANDROID_HOME
        yes "" | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
        # Accept licenses explicitly
        printf "%s\n" "y" | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" --licenses || true
      shell: bash

    - name: Set ANDROID_HOME and PATH
      run: |
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Ensure no conflicting vars
      run: |
        # Remove ANDROID_SDK_ROOT if present to avoid Gradle conflicts
        unset ANDROID_SDK_ROOT || true

    - name: Grant execute to gradlew
      run: chmod +x ./gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
