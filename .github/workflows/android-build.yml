name: Android CI (build native + APK)

on:
  push:
    branches:
      - hotspot-vpn-compat
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/android-sdk
      NDK_VERSION: 26.3.11579264
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_PLATFORM: android-34

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clone native hev-socks5-tunnel into app/src/main/jni
      run: |
        rm -rf app/src/main/jni || true
        mkdir -p app/src/main
        git clone --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-sdk@v2
      with:
        api-level: ${{ env.ANDROID_PLATFORM }}
        build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        ndk: ${{ env.NDK_VERSION }}
        components: "platform-tools;emulator"

    - name: Show SDK/NDK info
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la ${ANDROID_SDK_ROOT}
        ls -la ${ANDROID_SDK_ROOT}/ndk || true

    - name: Build project (Gradle assembleDebug)
      working-directory: ./app
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --stacktrace
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

    - name: List jniLibs and APK
      run: |
        echo "Built native libs (app/src/main/jniLibs):"
        ls -R app/src/main/jniLibs || true
        echo "APK files:"
        ls -R app/build/outputs/apk || true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
