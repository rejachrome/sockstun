name: Build debug APK

on:
  push:
    branches: [ hotspot-vpn-compat ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install prerequisites and Android SDK
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y wget unzip
        SDK_ROOT="$HOME/android-sdk"
        mkdir -p "${SDK_ROOT}/cmdline-tools"
        cd "$HOME"
        wget -O cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        unzip -q cmdline.zip -d cmdline-tools-temp
        mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
        mv cmdline-tools-temp/cmdline-tools/* "${SDK_ROOT}/cmdline-tools/latest/" || true
        # Force both vars to the same path so Gradle won't complain
        export ANDROID_SDK_ROOT="${SDK_ROOT}"
        export ANDROID_HOME="${SDK_ROOT}"
        echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> $GITHUB_ENV
        echo "ANDROID_HOME=${SDK_ROOT}" >> $GITHUB_ENV
        echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "${SDK_ROOT}/platform-tools" >> $GITHUB_PATH
        # Install required components (adjust api/build-tools versions if needed)
        "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" --licenses
      shell: bash

    - name: Grant execute to gradlew
      run: chmod +x ./gradlew

    - name: Build debug APK
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: ./gradlew assembleDebug --no-daemon
